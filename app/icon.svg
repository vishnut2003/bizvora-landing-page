<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    BizvoraOne site icon: the "Ascend" pillars on the site's own gradient
    tile (the pill-button gradient, 125deg #8C00FF → #450693), with a sheen
    top-left, a lavender glow bottom-right and a faint inner ring — the same
    treatment as the lit icon tiles in the nav drawer.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.08" stop-color="#8C00FF"/>
      <stop offset="0.92" stop-color="#450693"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.84" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBD4FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="tile">
      <path d="M0 32C0 21.254 0 15.882 1.966 11.724 3.992 7.44 7.44 3.992 11.724 1.966 15.882 0 21.254 0 32 0s16.118 0 20.276 1.966c4.284 2.026 7.732 5.474 9.758 9.758C64 15.882 64 21.254 64 32s0 16.118-1.966 20.276c-2.026 4.284-5.474 7.732-9.758 9.758C48.118 64 42.746 64 32 64s-16.118 0-20.276-1.966c-4.284-2.026-7.732-5.474-9.758-9.758C0 48.118 0 42.746 0 32Z"/>
    </clipPath>
  </defs>

  <!-- the tile -->
  <path fill="url(#ground)" d="M0 32C0 21.254 0 15.882 1.966 11.724 3.992 7.44 7.44 3.992 11.724 1.966 15.882 0 21.254 0 32 0s16.118 0 20.276 1.966c4.284 2.026 7.732 5.474 9.758 9.758C64 15.882 64 21.254 64 32s0 16.118-1.966 20.276c-2.026 4.284-5.474 7.732-9.758 9.758C48.118 64 42.746 64 32 64s-16.118 0-20.276-1.966c-4.284-2.026-7.732-5.474-9.758-9.758C0 48.118 0 42.746 0 32Z"/>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#glow)"/>
    <rect width="64" height="64" fill="url(#sheen)"/>
    <!-- inner ring: the stroke is centred on the edge and clipped, so only
         its inner half shows -->
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.4" d="M0 32C0 21.254 0 15.882 1.966 11.724 3.992 7.44 7.44 3.992 11.724 1.966 15.882 0 21.254 0 32 0s16.118 0 20.276 1.966c4.284 2.026 7.732 5.474 9.758 9.758C64 15.882 64 21.254 64 32s0 16.118-1.966 20.276c-2.026 4.284-5.474 7.732-9.758 9.758C48.118 64 42.746 64 32 64s-16.118 0-20.276-1.966c-4.284-2.026-7.732-5.474-9.758-9.758C0 48.118 0 42.746 0 32Z"/>
  </g>

  <!-- the mark, centred at 72% with a soft shadow beneath -->
  <g transform="translate(32 33) scale(0.72) translate(-32 -32)">
    <g fill="#2A0561" opacity="0.5" filter="url(#soft)" transform="translate(0 2.6)">
      <rect x="6" y="44" width="10" height="14" rx="5"/>
      <rect x="20" y="34" width="10" height="24" rx="5"/>
      <rect x="34" y="24" width="10" height="34" rx="5"/>
      <rect x="48" y="6" width="10" height="52" rx="5"/>
    </g>
    <g fill="url(#bars)">
      <rect x="6" y="44" width="10" height="14" rx="5"/>
      <rect x="20" y="34" width="10" height="24" rx="5"/>
      <rect x="34" y="24" width="10" height="34" rx="5"/>
      <rect x="48" y="6" width="10" height="52" rx="5"/>
    </g>
  </g>
</svg>
